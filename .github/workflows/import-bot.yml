name: Import bot source
on:
  push:
    paths:
      - 'transfer/part-05.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore bot files
        shell: bash
        run: |
          cat transfer/part-0{0,1,2,3,4,5}.txt | base64 --decode | tar -xJf -
          rm -rf transfer/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import sanitized Telegram bot source"
          git push
